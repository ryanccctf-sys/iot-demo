<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1.0" />
<title>智能工牌 IoT 系统</title>
<style>
:root{
  --bg:#f4f7fb;--panel:#fff;--line:#e7ecf3;--text:#162033;--muted:#6f7b90;
  --primary:#2f6fed;--primary2:#eaf1ff;--green:#18a05e;--greenbg:#eaf8f1;
  --red:#e44f4f;--redbg:#fff0f0;--orange:#e58a20;--orangebg:#fff6e9;
  --nav:#101a2d;--nav2:#17243b;--shadow:0 6px 24px rgba(31,51,84,.07);--radius:14px;
}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Arial,sans-serif;background:var(--bg);color:var(--text)}
button,input,select,textarea{font:inherit}.app{display:flex;min-height:100vh}.sidebar{width:250px;background:linear-gradient(180deg,#0e1829,#122039);color:#d7e0ef;position:fixed;inset:0 auto 0 0;overflow:auto}
.brand{height:74px;padding:16px 18px;border-bottom:1px solid rgba(255,255,255,.08);display:flex;align-items:center;gap:12px}.logo{width:38px;height:38px;border-radius:10px;background:#fff;color:#111827;display:grid;place-items:center;font-weight:800}.brand h1{font-size:17px;margin:0}.brand p{font-size:11px;color:#94a1b7;margin:4px 0 0}
.nav-section{padding:16px 10px 8px}.nav-title{font-size:11px;color:#718198;padding:0 12px 8px}.nav-item,.nav-sub{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:10px;cursor:pointer;margin:3px 0;user-select:none}.nav-item:hover,.nav-sub:hover{background:rgba(255,255,255,.06)}.nav-item.active,.nav-sub.active{background:var(--primary);color:#fff}.nav-sub{padding-left:38px;font-size:14px}.nav-item .ico{width:18px;text-align:center}.chev{margin-left:auto;font-size:11px}.subwrap{display:none}.subwrap.open{display:block}
.main{margin-left:250px;min-width:0;flex:1}.topbar{height:66px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:20}.crumb{font-size:14px;color:#667085}.crumb b{color:#182338}.topright{display:flex;gap:10px;align-items:center}.pill{padding:8px 12px;border:1px solid var(--line);border-radius:999px;background:#f8fafc;color:#596579;font-size:13px}.avatar{width:36px;height:36px;border-radius:50%;background:#172033;color:white;display:grid;place-items:center;font-weight:700}
.content{padding:28px}.pagehead{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:18px;gap:20px}.pagehead h2{margin:0 0 6px;font-size:28px}.pagehead p{margin:0;color:var(--muted);font-size:14px}.actions{display:flex;gap:10px;flex-wrap:wrap}
.btn{border:1px solid #d9e0ea;background:#fff;color:#263247;border-radius:9px;padding:9px 14px;cursor:pointer}.btn:hover{border-color:#aebbd0}.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}.btn.danger{color:var(--red);border-color:#ffb9b9;background:#fff}.btn.link{border:0;background:transparent;color:var(--primary);padding:4px 6px}.btn.small{padding:6px 10px;font-size:13px}
.grid{display:grid;gap:16px}.cards{grid-template-columns:repeat(5,minmax(0,1fr));margin-bottom:16px}.card,.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}.metric{padding:18px}.metric .label{color:var(--muted);font-size:13px}.metric .num{font-size:28px;font-weight:750;margin:10px 0 6px}.metric .hint{font-size:12px;color:#8190a4}.metric .good{color:var(--green)}.metric .warn{color:var(--orange)}
.panel{padding:18px}.panel h3{font-size:16px;margin:0}.panelhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.two{grid-template-columns:1.35fr .9fr}.three{grid-template-columns:1fr 1fr 1fr}.chart{height:300px;display:flex;align-items:flex-end;gap:18px;padding:28px 12px 24px;border-top:1px solid #eef2f7;position:relative}.chart:before{content:"";position:absolute;left:0;right:0;top:25%;bottom:25%;background:linear-gradient(to bottom,transparent 49%,#edf1f6 50%,transparent 51%);pointer-events:none}.bar{flex:1;background:linear-gradient(180deg,#6ea0ff,#2f6fed);border-radius:8px 8px 2px 2px;min-width:24px;position:relative}.bar span{position:absolute;left:50%;transform:translateX(-50%);bottom:-22px;font-size:12px;color:#718096;white-space:nowrap}.bar em{position:absolute;left:50%;transform:translateX(-50%);top:-22px;font-size:11px;color:#516070;font-style:normal}
.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:12px}.table{width:100%;border-collapse:collapse;min-width:1000px}.table th,.table td{padding:13px 14px;border-bottom:1px solid #edf1f5;text-align:left;font-size:13px;white-space:nowrap}.table th{background:#f8fafc;color:#667085;font-weight:650}.table tr:last-child td{border-bottom:none}.table tbody tr:hover{background:#fbfdff}.status{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 9px;font-size:12px;font-weight:650}.status:before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}.online,.success{color:var(--green);background:var(--greenbg)}.offline,.fail{color:var(--red);background:var(--redbg)}.warns{color:var(--orange);background:var(--orangebg)}.neutral{color:#667085;background:#f0f3f7}.recording{color:var(--primary);background:var(--primary2)}
.filters{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:16px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}.field{display:flex;gap:8px;align-items:center}.field label{font-size:13px;color:#556173;white-space:nowrap}.control{height:38px;border:1px solid #dbe2ec;border-radius:8px;background:#fff;padding:0 11px;min-width:145px;color:#334155}.control.wide{min-width:230px}
.progress{height:8px;background:#eef2f6;border-radius:99px;overflow:hidden}.progress i{display:block;height:100%;background:var(--primary);border-radius:99px}.low{color:var(--red);font-weight:700}.kv{display:grid;grid-template-columns:160px 1fr;border:1px solid var(--line);border-bottom:0}.kv div{padding:11px 13px;border-bottom:1px solid var(--line)}.kv .k{background:#f8fafc;font-weight:650;color:#566174}.section-title{font-weight:700;margin:20px 0 10px}.codebox{background:#0f172a;color:#d7e3f5;border-radius:10px;padding:14px;font:12px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre-wrap;max-height:220px;overflow:auto}
.modal-mask{position:fixed;inset:0;background:rgba(15,23,42,.45);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}.modal-mask.show{display:flex}.modal{background:#fff;border-radius:15px;width:min(820px,95vw);max-height:88vh;overflow:auto;box-shadow:0 30px 80px rgba(0,0,0,.24)}.modal.small{width:min(460px,92vw)}.modal.large{width:min(1120px,96vw)}.modal-head{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:white;z-index:2}.modal-body{padding:20px}.modal-foot{padding:14px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px}.x{font-size:22px;color:#8b97aa;cursor:pointer}
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-bottom:16px}.tab{padding:10px 14px;cursor:pointer;color:#697586;border-bottom:2px solid transparent}.tab.active{color:var(--primary);border-bottom-color:var(--primary);font-weight:700}
.detail-top{display:grid;grid-template-columns:1fr 1fr;gap:16px}.badge{display:inline-block;padding:3px 8px;border-radius:6px;font-size:12px;background:#eef3ff;color:#3a6ce8}.toggle{width:42px;height:24px;border-radius:99px;background:#d8dee8;position:relative;display:inline-block;vertical-align:middle;cursor:pointer}.toggle:after{content:"";position:absolute;width:18px;height:18px;top:3px;left:3px;background:white;border-radius:50%;box-shadow:0 1px 4px rgba(0,0,0,.2);transition:.2s}.toggle.on{background:var(--primary)}.toggle.on:after{left:21px}.config-grid{display:grid;grid-template-columns:180px 1fr;gap:12px 16px;align-items:center}.help{padding:12px 14px;background:#fff8eb;border:1px solid #f5cf8a;color:#a96b0b;border-radius:10px;font-size:12px;line-height:1.65}.empty{padding:50px;text-align:center;color:#8a96a8}

.org-layout{display:grid;grid-template-columns:310px 1fr;gap:16px;align-items:start}
.org-tree{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.org-tree-head{padding:16px 18px;border-bottom:1px solid var(--line);font-weight:700;display:flex;align-items:center;justify-content:space-between}
.tree{padding:10px 0}
.tree-row{display:flex;align-items:center;gap:8px;padding:10px 14px 10px 18px;cursor:pointer;border-left:3px solid transparent}
.tree-row:hover{background:#f8fafc}.tree-row.active{background:#eef4ff;border-left-color:var(--primary);color:#1f5fd6;font-weight:700}
.tree-row.lv2{padding-left:38px}.tree-row.lv3{padding-left:58px}.tree-row.lv4{padding-left:78px}
.tree-actions{margin-left:auto;display:flex;gap:7px;color:var(--primary);font-size:13px}
.org-main{min-width:0}
.org-current{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:16px;font-weight:700}
.org-code{color:#7b8798;font-size:12px;margin-left:6px}

@media(max-width:1200px){.cards{grid-template-columns:repeat(3,1fr)}.two,.three{grid-template-columns:1fr}}@media(max-width:820px){.sidebar{width:210px}.main{margin-left:210px}.content{padding:18px}.cards{grid-template-columns:1fr 1fr}.topright .pill{display:none}}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand"><div class="logo">Z</div><div><h1>智能工牌 IoT 系统</h1><p>设备与数据链路管理平台</p></div></div>
    <div id="nav"></div>
  </aside>
  <main class="main">
    <header class="topbar">
      <div class="crumb">智能工牌系统 / <b id="crumb">IoT 首页</b></div>
      <div class="topright"><div class="pill">● 平台运行正常</div><div class="pill">最后同步：2026-10-12 09:36:18</div><div class="avatar">PM</div></div>
    </header>
    <section class="content" id="content"></section>
  </main>
</div>

<div class="modal-mask" id="modalMask" onclick="maskClose(event)">
  <div class="modal" id="modal">
    <div class="modal-head"><b id="modalTitle">详情</b><span class="x" onclick="closeModal()">×</span></div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-foot" id="modalFoot"><button class="btn" onclick="closeModal()">关闭</button></div>
  </div>
</div>

<script>
const state={page:'home', selected:[], openGroups:{log:true}, currentDevice:null};
const devices=[
 {sn:'BDG-000231',brand:'Badge',model:'X2',store:'上海静安店',user:'张晨',status:'在线',battery:82,signal:'良好',record:'录音中',firmware:'v2.3.1',sync:'2026-10-12 09:35:10',slice:'5分钟',mode:'自动录音'},
 {sn:'BDG-000418',brand:'Badge',model:'M5',store:'杭州滨江店',user:'李哲',status:'在线',battery:46,signal:'弱',record:'录音中',firmware:'v2.3.0',sync:'2026-10-12 09:34:51',slice:'10分钟',mode:'按键录音'},
 {sn:'BDG-000522',brand:'VoiceBadge',model:'S3',store:'苏州工业园店',user:'王睿',status:'离线',battery:14,signal:'--',record:'未知',firmware:'v2.2.8',sync:'2026-10-12 08:16:04',slice:'5分钟',mode:'自动录音'},
 {sn:'BDG-000638',brand:'Badge',model:'X2 Pro',store:'上海浦东店',user:'周宁',status:'在线',battery:67,signal:'良好',record:'未录音',firmware:'v2.3.1',sync:'2026-10-12 09:35:01',slice:'15分钟',mode:'声控录音'},
 {sn:'BDG-000702',brand:'Badge',model:'L1',store:'南京河西店',user:'赵辰',status:'离线',battery:18,signal:'--',record:'--',firmware:'v2.2.9',sync:'2026-10-11 16:21:45',slice:'10分钟',mode:'自动录音'}
];
const menus=[
 {group:'工作台',items:[{id:'home',label:'IoT 首页',ico:'⌂'}]},
 {group:'设备',items:[{id:'devices',label:'设备管理',ico:'▣'}]},
 {group:'录音',items:[{id:'voiceprint',label:'声纹管理',ico:'◌'}]},
 {group:'组织',items:[{id:'org',label:'组织机构管理',ico:'⌘'}]},
 {group:'运维',items:[{id:'ota',label:'OTA 升级',ico:'⇧'},{id:'sim',label:'流量卡管理',ico:'▤'},{id:'storage',label:'存储与回调',ico:'↔'},{id:'push',label:'推送日志',ico:'↗'}]},
 {group:'日志',items:[{id:'logGroup',label:'日志',ico:'☷',children:[{id:'heartbeat',label:'设备心跳日志'},{id:'filelog',label:'文件上传日志'},{id:'controlLog',label:'操控日志'}]}]}
];
function renderNav(){
 const root=document.getElementById('nav'); root.innerHTML='';
 menus.forEach(sec=>{
   const wrap=document.createElement('div');wrap.className='nav-section';
   wrap.innerHTML=`<div class="nav-title">${sec.group}</div>`;
   sec.items.forEach(it=>{
     if(it.children){
       const ni=document.createElement('div');ni.className='nav-item';ni.innerHTML=`<span class="ico">${it.ico}</span>${it.label}<span class="chev">⌃</span>`;
       ni.onclick=()=>{state.openGroups.log=!state.openGroups.log;renderNav()};wrap.appendChild(ni);
       const sub=document.createElement('div');sub.className='subwrap '+(state.openGroups.log?'open':'');
       it.children.forEach(c=>{const el=document.createElement('div');el.className='nav-sub '+(state.page===c.id?'active':'');el.textContent=c.label;el.onclick=()=>go(c.id,c.label);sub.appendChild(el)});wrap.appendChild(sub);
     } else {
       const el=document.createElement('div');el.className='nav-item '+(state.page===it.id?'active':'');el.innerHTML=`<span class="ico">${it.ico}</span>${it.label}`;el.onclick=()=>go(it.id,it.label);wrap.appendChild(el);
     }
   });root.appendChild(wrap);
 });
}
function go(id,label){state.page=id;document.getElementById('crumb').textContent=label||titleFor(id);renderNav();renderPage()}
function titleFor(id){const map={home:'IoT 首页',devices:'设备管理',upload:'录音上传日志',voiceprint:'声纹管理',org:'组织机构管理',ota:'OTA 升级',sim:'流量卡管理',storage:'存储与回调',push:'推送日志',heartbeat:'设备心跳日志',filelog:'文件上传日志',controlLog:'操控日志'};return map[id]||id}
function pageHead(t,sub,actions=''){return `<div class="pagehead"><div><h2>${t}</h2><p>${sub||''}</p></div><div class="actions">${actions}</div></div>`}
function status(v){return `<span class="status ${v==='在线'?'online':v==='离线'?'offline':v==='成功'||v==='执行成功'?'success':v==='失败'||v==='下发失败'?'fail':'neutral'}">${v}</span>`}
function openModal(title,body,foot,cls=''){document.getElementById('modalTitle').textContent=title;document.getElementById('modalBody').innerHTML=body;document.getElementById('modalFoot').innerHTML=foot||`<button class="btn" onclick="closeModal()">关闭</button>`;document.getElementById('modal').className='modal '+cls;document.getElementById('modalMask').classList.add('show')}
function closeModal(){document.getElementById('modalMask').classList.remove('show')}
function maskClose(e){if(e.target.id==='modalMask')closeModal()}
function renderPage(){const c=document.getElementById('content');({home:renderHome,devices:renderDevices,upload:renderUpload,voiceprint:renderVoiceprint,org:renderOrg,ota:renderOTA,sim:renderSIM,storage:renderStorage,push:renderPush,heartbeat:renderHeartbeat,filelog:renderFileLog,controlLog:renderControlLog}[state.page]||renderHome)(c)}

function renderHome(c){
 c.innerHTML=pageHead('IoT 首页','实时掌握智能工牌在线状态、离线状态与设备运行情况')+`
 <div class="grid cards">
   ${[['设备总数','12,680','全部已纳管设备'],['已激活','11,420','激活率 90.1%'],['绑定设备','9,832','当前已绑定工牌数量'],['离线设备','1,588','需关注长期离线'],['低电量设备','186','电量低于 20%']].map((x,i)=>`<div class="card metric"><div class="label">${x[0]}</div><div class="num ${i===4?'warn':''}">${x[1]}</div><div class="hint">${x[2]}</div></div>`).join('')}
 </div>
 <div class="grid two">
   <div class="panel"><div class="panelhead"><div><h3>近 7 天在线设备数</h3><div class="hint">按日统计在线设备规模</div></div><span class="badge">近7天</span></div>
     <div class="chart">${[['10/06',9368],['10/07',9482],['10/08',9560],['10/09',9612],['10/10',9721],['10/11',9788],['10/12',9832]].map(x=>`<div class="bar" style="height:${Math.round((x[1]-9000)/9)+105}px"><em>${x[1]}</em><span>${x[0]}</span></div>`).join('')}</div>
   </div>
   <div class="panel"><div class="panelhead"><div><h3>低电量提醒列表</h3><div class="hint">电量低于 20% 的设备</div></div><button class="btn link" onclick="showLowBattery()">查看更多</button></div>
     <div class="tablewrap"><table class="table" style="min-width:600px"><thead><tr><th>SN</th><th>门店/人员</th><th>电量</th><th>最后同步</th></tr></thead><tbody>
     ${devices.concat([{sn:'BDG-000811',store:'宁波中心店',user:'陈远',battery:12,sync:'2026-10-12 09:20:18'},{sn:'BDG-000836',store:'合肥政务店',user:'刘宇',battery:9,sync:'2026-10-12 09:18:30'},{sn:'BDG-000921',store:'武汉光谷店',user:'孙博',battery:17,sync:'2026-10-12 09:15:02'},{sn:'BDG-001022',store:'无锡新城店',user:'许明',battery:11,sync:'2026-10-12 09:10:06'},{sn:'BDG-001118',store:'常州武进店',user:'邹杰',battery:15,sync:'2026-10-12 09:02:41'}]).filter(d=>d.battery<20).slice(0,10).map(d=>`<tr><td>${d.sn}</td><td>${d.store} / ${d.user}</td><td class="low">${d.battery}%</td><td>${d.sync}</td></tr>`).join('')}
     </tbody></table></div>
   </div>
 </div>`;
}
function showLowBattery(){openModal('低电量设备明细',`<div class="filters"><input class="control wide" placeholder="搜索 SN / 门店 / 人员"><select class="control"><option>全部电量</option><option><10%</option><option>10%-20%</option></select><button class="btn primary">查询</button></div><div class="tablewrap"><table class="table"><thead><tr><th>SN</th><th>门店/人员</th><th>电量</th><th>状态</th><th>最后同步</th></tr></thead><tbody>${devices.filter(d=>d.battery<20).map(d=>`<tr><td>${d.sn}</td><td>${d.store}/${d.user}</td><td class="low">${d.battery}%</td><td>${status(d.status)}</td><td>${d.sync}</td></tr>`).join('')}</tbody></table></div>`,null,'large')}

function renderDevices(c){
 c.innerHTML=pageHead('设备管理','设备注册、换绑、解绑、调拨、远程监控与参数下发',`<button class="btn" onclick="batchCmd()">批量下发指令</button><button class="btn primary" onclick="deviceRegister()">设备注册</button><button class="btn" onclick="batchRegister()">批量注册</button>`)+`
 <div class="filters">
   <input class="control wide" placeholder="搜索 SN / 人员 / 门店">
   <select class="control"><option>全部状态</option><option>在线</option><option>离线</option></select>
   <select class="control"><option>切片时间</option><option>5分钟</option><option>10分钟</option><option>15分钟</option></select>
   <select class="control"><option>录音模式</option><option>自动录音</option><option>按键录音</option><option>声控录音</option></select>
   <button class="btn primary">查询</button><button class="btn">重置</button><button class="btn">导出</button>
 </div>
 <div class="tablewrap"><table class="table"><thead><tr><th><input type="checkbox" onchange="toggleAll(this)"></th><th>SN</th><th>工牌品牌</th><th>工牌型号</th><th>门店 / 人员</th><th>状态</th><th>电量</th><th>信号</th><th>切片时间</th><th>录音模式</th><th>固件版本</th><th>最后同步</th><th>操作</th></tr></thead><tbody>
 ${devices.map((d,i)=>`<tr><td><input type="checkbox" class="devcheck" value="${i}"></td><td><b>${d.sn}</b></td><td>${d.brand}</td><td>${d.model}</td><td>${d.store}<br>${d.user}</td><td>${status(d.status)}</td><td class="${d.battery<20?'low':''}">${d.battery}%</td><td>${d.signal}</td><td>${d.slice}</td><td>${d.mode}</td><td>${d.firmware}</td><td>${d.sync}</td><td><button class="btn small" onclick="deviceDetail(${i})">详情</button> <button class="btn small" onclick="deviceRebind(${i})">换绑</button> <button class="btn small" onclick="deviceTransfer(${i})">调拨</button> <button class="btn small danger" onclick="deviceUnbind(${i})">解绑</button></td></tr>`).join('')}
 </tbody></table></div>`;
