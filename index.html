<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>智能工牌 IoT 系统</title>
<style>
:root{--bg:#f4f7fb;--panel:#fff;--line:#e7ecf3;--text:#162033;--muted:#6f7b90;--primary:#2f6fed;--green:#18a05e;--red:#e44f4f;--orange:#e58a20;--nav:#101a2d;--shadow:0 6px 24px rgba(31,51,84,.07);--radius:14px}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Arial,sans-serif;background:var(--bg);color:var(--text)}button,input,select,textarea{font:inherit}
.app{display:flex;min-height:100vh}.sidebar{width:250px;background:linear-gradient(180deg,#0e1829,#122039);color:#d7e0ef;position:fixed;inset:0 auto 0 0;overflow:auto}.main{margin-left:250px;flex:1;min-width:0}
.brand{height:74px;padding:16px 18px;border-bottom:1px solid rgba(255,255,255,.08);display:flex;align-items:center;gap:12px}.logo{width:38px;height:38px;border-radius:10px;background:#fff;color:#111827;display:grid;place-items:center;font-weight:800}.brand h1{font-size:17px;margin:0}.brand p{font-size:11px;color:#94a1b7;margin:4px 0 0}
.nav-section{padding:16px 10px 8px}.nav-title{font-size:11px;color:#718198;padding:0 12px 8px}.nav-item,.nav-sub{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:10px;cursor:pointer;margin:3px 0}.nav-item:hover,.nav-sub:hover{background:rgba(255,255,255,.06)}.nav-item.active,.nav-sub.active{background:var(--primary);color:#fff}.nav-sub{padding-left:38px;font-size:14px}.ico{width:18px;text-align:center}.chev{margin-left:auto;font-size:11px}.subwrap{display:none}.subwrap.open{display:block}
.topbar{height:66px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:20}.crumb{font-size:14px;color:#667085}.crumb b{color:#182338}.topright{display:flex;gap:10px;align-items:center}.pill{padding:8px 12px;border:1px solid var(--line);border-radius:999px;background:#f8fafc;color:#596579;font-size:13px}.avatar{width:36px;height:36px;border-radius:50%;background:#172033;color:white;display:grid;place-items:center;font-weight:700}
.content{padding:28px}.pagehead{display:flex;justify-content:space-between;gap:20px;margin-bottom:18px}.pagehead h2{margin:0 0 6px;font-size:28px}.pagehead p{margin:0;color:var(--muted);font-size:14px}.actions{display:flex;gap:10px;flex-wrap:wrap}
.btn{border:1px solid #d9e0ea;background:#fff;color:#263247;border-radius:9px;padding:9px 14px;cursor:pointer}.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}.btn.danger{color:var(--red);border-color:#ffb9b9}.btn.small{padding:6px 10px;font-size:13px}.btn.link{border:0;background:transparent;color:var(--primary);padding:4px 6px}
.grid{display:grid;gap:16px}.cards{grid-template-columns:repeat(5,minmax(0,1fr));margin-bottom:16px}.card,.panel{background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}.metric{padding:18px}.metric .label{color:var(--muted);font-size:13px}.metric .num{font-size:28px;font-weight:750;margin:10px 0 6px}.metric .hint{font-size:12px;color:#8190a4}.panel{padding:18px}.panelhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.two{grid-template-columns:1.35fr .9fr}
.chart{height:300px;display:flex;align-items:flex-end;gap:18px;padding:28px 12px 24px;border-top:1px solid #eef2f7}.bar{flex:1;background:linear-gradient(180deg,#6ea0ff,#2f6fed);border-radius:8px 8px 2px 2px;min-width:24px;position:relative}.bar span{position:absolute;left:50%;transform:translateX(-50%);bottom:-22px;font-size:12px;color:#718096}.bar em{position:absolute;left:50%;transform:translateX(-50%);top:-22px;font-size:11px;color:#516070;font-style:normal}
.filters{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:16px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}.control{height:38px;border:1px solid #dbe2ec;border-radius:8px;background:#fff;padding:0 11px;min-width:145px;color:#334155}.control.wide{min-width:230px}
.tablewrap{overflow-x:auto;overflow-y:visible;border:1px solid var(--line);border-radius:12px}.table{width:100%;border-collapse:collapse;min-width:1000px}.table th,.table td{padding:13px 14px;border-bottom:1px solid #edf1f5;text-align:left;font-size:13px;white-space:nowrap}.table th{background:#f8fafc;color:#667085;font-weight:650}.table tbody tr:hover{background:#fbfdff}.table td{position:relative}
.status{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 9px;font-size:12px;font-weight:650}.status:before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}.online,.success{color:var(--green);background:#eaf8f1}.offline,.fail{color:var(--red);background:#fff0f0}.warns{color:var(--orange);background:#fff6e9}.neutral{color:#667085;background:#f0f3f7}.low{color:var(--red);font-weight:700}.badge{display:inline-block;padding:3px 8px;border-radius:6px;font-size:12px;background:#eef3ff;color:#3a6ce8}
.kv{display:grid;grid-template-columns:160px 1fr;border:1px solid var(--line);border-bottom:0}.kv div{padding:11px 13px;border-bottom:1px solid var(--line)}.kv .k{background:#f8fafc;font-weight:650;color:#566174}.section-title{font-weight:700;margin:20px 0 10px}.help{padding:12px 14px;background:#fff8eb;border:1px solid #f5cf8a;color:#a96b0b;border-radius:10px;font-size:12px;line-height:1.65}.codebox{background:#0f172a;color:#d7e3f5;border-radius:10px;padding:14px;font:12px/1.55 ui-monospace,monospace;white-space:pre-wrap;max-height:220px;overflow:auto}
.modal-mask{position:fixed;inset:0;background:rgba(15,23,42,.45);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}.modal-mask.show{display:flex}.modal{background:#fff;border-radius:15px;width:min(820px,95vw);max-height:88vh;overflow:auto}.modal.small{width:min(460px,92vw)}.modal.large{width:min(1120px,96vw)}.modal-head{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:white;z-index:2}.modal-body{padding:20px}.modal-foot{padding:14px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px}.x{font-size:22px;color:#8b97aa;cursor:pointer}
.config-grid{display:grid;grid-template-columns:180px 1fr;gap:12px 16px;align-items:center}.toggle{width:42px;height:24px;border-radius:99px;background:#d8dee8;position:relative;display:inline-block;vertical-align:middle;cursor:pointer}.toggle:after{content:"";position:absolute;width:18px;height:18px;top:3px;left:3px;background:white;border-radius:50%;transition:.2s}.toggle.on{background:var(--primary)}.toggle.on:after{left:21px}
.op-menu{position:relative;display:inline-block;padding-bottom:6px;margin-bottom:-6px}.op-trigger{width:36px;height:32px;border:1px solid #d9e0ea;background:#fff;border-radius:10px;cursor:pointer;font-size:18px;letter-spacing:2px;color:#526071;display:flex;align-items:center;justify-content:center;line-height:1}.op-trigger:hover,.op-trigger:focus{background:#f8fafc;border-color:#b8c4d5;outline:none}.op-dropdown{display:none;position:absolute;right:0;top:32px;z-index:1000;min-width:118px;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 30px rgba(31,51,84,.16);padding:6px}.op-menu:hover .op-dropdown,.op-menu:focus-within .op-dropdown,.op-menu.open .op-dropdown{display:flex;flex-direction:column;gap:2px}.op-dropdown:before{content:"";position:absolute;left:0;right:0;top:-8px;height:8px}.op-dropdown button{display:block;width:100%;border:0;background:transparent;text-align:left;padding:9px 10px;border-radius:8px;cursor:pointer;color:#263247;font-size:13px;line-height:1.4;white-space:nowrap}.op-dropdown button:hover,.op-dropdown button:focus{background:#f3f6fa;outline:none}.op-dropdown .danger-item{color:var(--red)}
.record-tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px}.record-tab{padding:10px 16px;cursor:pointer;color:#697586;border-bottom:2px solid transparent}.record-tab.active{color:var(--primary);border-bottom-color:var(--primary);font-weight:700}
.org-layout{display:grid;grid-template-columns:310px 1fr;gap:16px;align-items:start}.org-tree{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}.org-tree-head{padding:16px 18px;border-bottom:1px solid var(--line);font-weight:700;display:flex;justify-content:space-between}.tree{padding:10px 0}.tree-row{display:flex;align-items:center;gap:8px;padding:10px 14px 10px 18px;cursor:pointer;border-left:3px solid transparent}.tree-row:hover{background:#f8fafc}.tree-row.active{background:#eef4ff;border-left-color:var(--primary);color:#1f5fd6;font-weight:700}.tree-row.lv2{padding-left:38px}.tree-row.lv3{padding-left:58px}.tree-actions{margin-left:auto;display:flex;gap:7px;color:var(--primary);font-size:13px}.org-current{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:16px;font-weight:700}.org-code{color:#7b8798;font-size:12px;margin-left:6px}

.audio-player-box{padding:16px;border:1px solid var(--line);border-radius:12px;background:#f8fafc;margin-top:16px}
.audio-player-box audio{width:100%}
.file-meta{display:grid;grid-template-columns:160px 1fr;border:1px solid var(--line);border-bottom:0}
.file-meta div{padding:11px 13px;border-bottom:1px solid var(--line)}
.file-meta .k{background:#f8fafc;font-weight:650;color:#566174}
@media(max-width:1200px){.cards{grid-template-columns:repeat(3,1fr)}.two,.org-layout{grid-template-columns:1fr}} 
</style>
</head>
<body>
<div class="app">
<aside class="sidebar"><div class="brand"><div class="logo">Z</div><div><h1>智能工牌 IoT 系统</h1><p>设备与数据链路管理平台</p></div></div><div id="nav"></div></aside>
<main class="main"><header class="topbar"><div class="crumb">智能工牌系统 / <b id="crumb">IoT 首页</b></div><div class="topright"><div class="pill">● 平台运行正常</div><div class="pill">最后同步：2026-10-27 10:44:18</div><div class="avatar">PM</div></div></header><section class="content" id="content"></section></main>
</div>
<div class="modal-mask" id="modalMask" onclick="if(event.target.id==='modalMask')closeModal()"><div class="modal" id="modal"><div class="modal-head"><b id="modalTitle"></b><span class="x" onclick="closeModal()">×</span></div><div class="modal-body" id="modalBody"></div><div class="modal-foot" id="modalFoot"></div></div></div>
<script>
const state={page:'home',openLog:true};
const devices=[
{sn:'BDG-000231',brand:'Badge',model:'X2',store:'上海静安店',user:'张晨',status:'在线',battery:82,signal:'良好',firmware:'v2.3.1',sync:'2026-10-27 10:42:10',slice:'5分钟',mode:'自动录音'},
{sn:'BDG-000418',brand:'Badge',model:'M5',store:'杭州滨江店',user:'李哲',status:'在线',battery:46,signal:'弱',firmware:'v2.3.0',sync:'2026-10-27 10:41:51',slice:'10分钟',mode:'按键录音'},
{sn:'BDG-000522',brand:'VoiceBadge',model:'S3',store:'苏州工业园店',user:'王睿',status:'离线',battery:14,signal:'--',firmware:'v2.2.8',sync:'2026-10-27 08:16:04',slice:'5分钟',mode:'自动录音'},
{sn:'BDG-000638',brand:'Badge',model:'X2 Pro',store:'上海浦东店',user:'周宁',status:'在线',battery:67,signal:'良好',firmware:'v2.3.1',sync:'2026-10-27 10:42:01',slice:'15分钟',mode:'声控录音'},
{sn:'BDG-000702',brand:'Badge',model:'L1',store:'南京河西店',user:'赵辰',status:'离线',battery:18,signal:'--',firmware:'v2.2.9',sync:'2026-10-26 16:21:45',slice:'10分钟',mode:'自动录音'}
];
const menus=[
{group:'工作台',items:[{id:'home',label:'IoT 首页',ico:'⌂'}]},
{group:'设备',items:[{id:'devices',label:'设备管理',ico:'▣'}]},
{group:'录音',items:[{id:'voiceprint',label:'声纹管理',ico:'◌'}]},
{group:'组织',items:[{id:'org',label:'组织机构管理',ico:'⌘'}]},
{group:'运维',items:[{id:'ota',label:'OTA 升级',ico:'⇧'},{id:'sim',label:'流量卡管理',ico:'▤'},{id:'storage',label:'存储与回调',ico:'↔'},{id:'push',label:'推送日志',ico:'↗'}]},
{group:'日志',items:[{id:'logGroup',label:'日志',ico:'☷',children:[{id:'heartbeat',label:'设备心跳日志'},{id:'filelog',label:'文件上传日志'},{id:'controlLog',label:'操控日志'}]}]}
];
function titleFor(id){return {home:'IoT 首页',devices:'设备管理',voiceprint:'声纹管理',org:'组织机构管理',ota:'OTA 升级',sim:'流量卡管理',storage:'存储与回调',push:'推送日志',heartbeat:'设备心跳日志',filelog:'文件上传日志',controlLog:'操控日志'}[id]||id}
function renderNav(){const n=document.getElementById('nav');n.innerHTML='';menus.forEach(s=>{const w=document.createElement('div');w.className='nav-section';w.innerHTML=`<div class="nav-title">${s.group}</div>`;s.items.forEach(it=>{if(it.children){const a=document.createElement('div');a.className='nav-item';a.innerHTML=`<span class="ico">${it.ico}</span>${it.label}<span class="chev">⌃</span>`;a.onclick=()=>{state.openLog=!state.openLog;renderNav()};w.appendChild(a);const sub=document.createElement('div');sub.className='subwrap '+(state.openLog?'open':'');it.children.forEach(c=>{const e=document.createElement('div');e.className='nav-sub '+(state.page===c.id?'active':'');e.textContent=c.label;e.onclick=()=>go(c.id);sub.appendChild(e)});w.appendChild(sub)}else{const e=document.createElement('div');e.className='nav-item '+(state.page===it.id?'active':'');e.innerHTML=`<span class="ico">${it.ico}</span>${it.label}`;e.onclick=()=>go(it.id);w.appendChild(e)}});n.appendChild(w)})}
function go(id){state.page=id;document.getElementById('crumb').textContent=titleFor(id);renderNav();renderPage()}
function pageHead(t,s,a=''){return `<div class="pagehead"><div><h2>${t}</h2><p>${s||''}</p></div><div class="actions">${a}</div></div>`}
function status(v){return `<span class="status ${v==='在线'||v==='成功'||v==='执行成功'?'online':v==='离线'||v==='失败'||v==='下发失败'?'offline':'neutral'}">${v}</span>`}
function openModal(t,b,f='<button class="btn" onclick="closeModal()">关闭</button>',cls=''){modalTitle.textContent=t;modalBody.innerHTML=b;modalFoot.innerHTML=f;modal.className='modal '+cls;modalMask.classList.add('show')}
function closeModal(){modalMask.classList.remove('show')}
function toast(t){const d=document.createElement('div');d.textContent=t;d.style.cssText='position:fixed;right:28px;top:84px;background:#182338;color:#fff;padding:10px 16px;border-radius:8px;z-index:99';document.body.appendChild(d);setTimeout(()=>d.remove(),1500)}
function renderPage(){({home:renderHome,devices:renderDevices,voiceprint:renderVoiceprint,org:renderOrg,ota:renderOTA,sim:renderSIM,storage:renderStorage,push:renderPush,heartbeat:renderHeartbeat,filelog:renderFileLog,controlLog:renderControlLog}[state.page]||renderHome)(content)}

function renderHome(c){c.innerHTML=pageHead('IoT 首页','实时掌握智能工牌设备运行情况')+`
<div class="grid cards">${[['设备总数','12,680','全部已纳管设备'],['已激活','11,420','激活率 90.1%'],['绑定设备','9,832','当前已绑定工牌数量'],['离线设备','1,588','需关注长期离线'],['低电量设备','186','电量低于 20%']].map(x=>`<div class="card metric"><div class="label">${x[0]}</div><div class="num">${x[1]}</div><div class="hint">${x[2]}</div></div>`).join('')}</div>
<div class="grid two"><div class="panel"><div class="panelhead"><h3>近 7 天在线设备数</h3></div><div class="chart">${[['10/21',9368],['10/22',9482],['10/23',9560],['10/24',9612],['10/25',9721],['10/26',9788],['10/27',9832]].map(x=>`<div class="bar" style="height:${100+(x[1]-9300)/5}px"><em>${x[1]}</em><span>${x[0]}</span></div>`).join('')}</div></div><div class="panel"><div class="panelhead"><h3>低电量提醒列表</h3><button class="btn link">查看更多</button></div><div class="tablewrap"><table class="table" style="min-width:600px"><thead><tr><th>SN</th><th>门店/人员</th><th>电量</th><th>最后同步</th></tr></thead><tbody>${devices.filter(x=>x.battery<20).map(d=>`<tr><td>${d.sn}</td><td>${d.store}/${d.user}</td><td class="low">${d.battery}%</td><td>${d.sync}</td></tr>`).join('')}</tbody></table></div></div></div>`}


function closeAllOpMenus(except=null){
 document.querySelectorAll('.op-menu.open').forEach(m=>{ if(m!==except) m.classList.remove('open'); });
}
function toggleOpMenu(event,btn){
 event.stopPropagation();
 const menu=btn.closest('.op-menu');
 const willOpen=!menu.classList.contains('open');
 closeAllOpMenus(menu);
 menu.classList.toggle('open',willOpen);
 if(willOpen){
   setTimeout(()=>{ const first=menu.querySelector('.op-dropdown button'); if(first) first.focus({preventScroll:true}); },0);
 }
}
document.addEventListener('click',()=>closeAllOpMenus());
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeAllOpMenus(); });

function renderDevices(c){c.innerHTML=pageHead('设备管理','设备注册、换绑、解绑、调拨、运行监控与配置记录',`<button class="btn" onclick="batchCmd()">批量下发指令</button><button class="btn primary" onclick="deviceRegister()">设备注册</button><button class="btn" onclick="batchRegister()">批量注册</button>`)+`
<div class="filters"><input class="control wide" placeholder="搜索 SN / 人员 / 门店"><select class="control"><option>全部状态</option><option>在线</option><option>离线</option></select><select class="control"><option>切片时间</option><option>5分钟</option><option>10分钟</option><option>15分钟</option></select><select class="control"><option>录音模式</option><option>自动录音</option><option>按键录音</option><option>声控录音</option></select><button class="btn primary">查询</button><button class="btn">重置</button><button class="btn">导出</button></div>
<div class="tablewrap" style="padding-bottom:150px;margin-bottom:-150px"><table class="table"><thead><tr><th><input type="checkbox"></th><th>SN</th><th>工牌品牌</th><th>工牌型号</th><th>门店 / 人员</th><th>状态</th><th>电量</th><th>信号</th><th>切片时间</th><th>录音模式</th><th>固件版本</th><th>最后同步</th><th>操作</th></tr></thead><tbody>
${devices.map((d,i)=>`<tr><td><input type="checkbox"></td><td><b>${d.sn}</b></td><td>${d.brand}</td><td>${d.model}</td><td>${d.store}<br>${d.user}</td><td>${status(d.status)}</td><td class="${d.battery<20?'low':''}">${d.battery}%</td><td>${d.signal}</td><td>${d.slice}</td><td>${d.mode}</td><td>${d.firmware}</td><td>${d.sync}</td><td><div class="op-menu"><button class="op-trigger" onclick="toggleOpMenu(event,this)" onkeydown="if(event.key===\'Escape\')closeAllOpMenus()">•••</button><div class="op-dropdown" onclick="event.stopPropagation()"><button onclick="deviceDetail(${i})">详情</button><button onclick="deviceOperationRecords(${i})">操作记录</button><button onclick="deviceRecordFiles(${i})">录音文件</button><button onclick="deviceRebind(${i})">换绑</button><button onclick="deviceTransfer(${i})">调拨</button><button class="danger-item" onclick="deviceUnbind(${i})">解绑</button></div></div></td></tr>`).join('')}
</tbody></table></div>`}

function batchCmd(){openModal('批量下发指令',`<div class="config-grid"><label>切片时间</label><select class="control"><option>5分钟</option><option>10分钟</option><option>15分钟</option></select><label>录音模式</label><select class="control"><option>自动录音</option><option>按键录音</option><option>声控录音</option></select></div>`,`<button class="btn" onclick="closeModal()">取消</button><button class="btn primary" onclick="closeModal();toast('指令已下发')">确认下发</button>`,'small')}
